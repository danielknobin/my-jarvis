
<!DOCTYPE html>n
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<style>
body {
  margin: 0;
  background: #020817;
  color: #00cfff;
  font-family: Arial;
  text-align: center;
}
h1 {
  margin-top: 55px;
  letter-spacing: 8px;
  text-shadow: 0 0 20px #00cfff;
}
.circle {
  width: 190px;
  height: 190px;
  border: 4px solid #00cfff;
  border-radius: 50%;
  margin: 45px auto;
  box-shadow: 0 0 30px #00cfff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  animation: glow 2s infinite alternate;
}
@keyframes glow {
  to { box-shadow: 0 0 55px #008cff; }
}
button {
  background: #003b61;
  color: white;
  border: 1px solid #00cfff;
  padding: 15px 25px;
  border-radius: 25px;
  margin: 10px;
  font-size: 16px;
}
#reply { padding: 20px; }
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<p>JUST A RATHER VERY INTELLIGENT SYSTEM</p>

<div class="circle">J</div>

<h3 id="reply">SYSTEM ONLINE</h3>

<button onclick="speak()">ACTIVATE JARVIS</button>
<button onclick="listen()">🎙️ SPEAK</button>

<script>
function speak() {
  say("Hello! I am Jarvis. All systems are online.");
}

function say(message) {
  document.getElementById("reply").innerText = message;
  let speech = new SpeechSynthesisUtterance(message);
  speechSynthesis.speak(speech);
}

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    say("Voice recognition is not supported in this browser.");
    return;
  }

  let recognition = new Recognition();
  recognition.lang = "en-IN";
  recognition.onresult = function(event) {
    let command = event.results[0][0].transcript;
    say("You said " + command);
  };
  recognition.start();
}

</script>
</body>
  </html>
